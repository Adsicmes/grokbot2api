services:
  grokbot2api:
    build: .
    image: grokbot2api:local
    container_name: grokbot2api
    restart: unless-stopped
    env_file: .env
    ports:
      # loopback only: expose through Caddy (mTLS) instead of binding the internet
      - "127.0.0.1:3010:3010"
    volumes:
      - ./accounts:/app/accounts
      - ./files:/app/files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
