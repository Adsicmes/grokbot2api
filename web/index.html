<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grok Bot 看板</title>
<style>
  :root {
    --bg: #0e1116; --card: #161b23; --line: #232b36; --fg: #e6edf3;
    --dim: #8b97a6; --acc: #4c9aff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 20px 24px 0; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .01em; }
  header .sub { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  main { padding: 16px 24px 32px; max-width: 1040px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 12px; font-weight: 500; color: var(--dim);
    text-transform: uppercase; letter-spacing: .08em; }
  .big { font-family: var(--mono); font-size: 30px; font-weight: 600; line-height: 1.1; }
  .big small { font-size: 13px; color: var(--dim); font-weight: 400; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0;
    font-family: var(--mono); font-size: 12.5px; }
  .row span:first-child { color: var(--dim); font-family: inherit; }
  .bar { height: 6px; border-radius: 3px; background: #232b36; overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .4s ease; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--dim);
    margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  section.chat { margin-top: 14px; }
  .chat-log { background: #0b0e13; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; height: 300px; overflow: auto; font-size: 13px; }
  .msg { margin: 0 0 10px; white-space: pre-wrap; word-break: break-word; }
  .msg b { color: var(--acc); font-weight: 600; margin-right: 6px; font-family: var(--mono); font-size: 11px; }
  form { display: flex; gap: 8px; margin-top: 10px; }
  select, input, button { font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: #10151c; color: var(--fg); padding: 9px 11px; }
  input { flex: 1; min-width: 0; }
  button { background: var(--acc); border-color: var(--acc); color: #06121f; font-weight: 600;
    cursor: pointer; padding: 9px 16px; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--dim); border-color: var(--line); font-weight: 400; }
  footer { color: var(--dim); font-size: 11.5px; font-family: var(--mono); padding: 0 24px 24px; }
</style>
</head>
<body>
<header>
  <h1>Grok Bot 看板</h1>
  <span class="sub" id="stamp">加载中…</span>
</header>
<main>
  <div class="grid">
    <div class="card">
      <h2>本周额度</h2>
      <div class="big" id="pct">—<small> 已用</small></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="row"><span>剩余</span><span id="left">—</span></div>
      <div class="row"><span>重置</span><span id="reset">—</span></div>
    </div>
    <div class="card">
      <h2>账号</h2>
      <div class="row"><span>email</span><span id="email">—</span></div>
      <div class="row"><span>token 到期</span><span id="exp">—</span></div>
      <div class="row"><span>状态</span><span id="state">—</span></div>
      <div class="row"><span>已处理请求</span><span id="reqs">—</span></div>
      <div class="row"><span>最近使用</span><span id="last">—</span></div>
    </div>
    <div class="card">
      <h2>网关</h2>
      <div class="row"><span>连通</span><span id="health">—</span></div>
      <div class="row"><span>上游耗时</span><span id="lat">—</span></div>
      <div class="row"><span>agent</span><span id="agent">—</span></div>
      <div class="row"><span>刷新</span><span><button class="ghost" id="reload">立即</button></span></div>
    </div>
  </div>

  <section class="chat card" style="margin-top:14px">
    <h2>测试对话 <span style="text-transform:none;letter-spacing:0;color:#5b6878">（消耗共享周额度）</span></h2>
    <div class="chat-log" id="log"></div>
    <form id="f">
      <select id="model">
        <option value="grok-bot-new">grok-bot-new（无记忆）</option>
        <option value="grok-bot">grok-bot（带记忆）</option>
      </select>
      <input id="q" placeholder="问点什么，回车发送" autocomplete="off">
      <button id="send">发送</button>
    </form>
  </section>
</main>
<footer>grokbot2api-web · 数据每 30s 刷新 · 访问由 mTLS 保护</footer>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (d) => new Date(d).toLocaleString('zh-CN', { hour12: false });

function state(v) {
  if (v === 'busy') return '<span class="dot" style="background:var(--warn)"></span>占用中';
  if (v === 'ok') return '<span class="dot ok"></span>正常';
  return '<span class="dot"></span>空闲';
}

async function load() {
  try {
    const r = await fetch('/api/overview', { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || r.status);
    const a = (d.accounts || [])[0] || {};
    const used = typeof a.usagePercent === 'number' ? a.usagePercent : null;
    $('pct').innerHTML = (used == null ? '—' : used.toFixed(2)) + '<small> % 已用</small>';
    $('bar').style.width = Math.min(100, used || 0) + '%';
    $('bar').style.background = used == null ? 'var(--dim)' : used > 85 ? 'var(--bad)' : used > 60 ? 'var(--warn)' : 'var(--ok)';
    $('left').textContent = used == null ? '—' : (100 - used).toFixed(2) + ' %';
    $('reset').textContent = a.nextResetUtc ? fmt(a.nextResetUtc) : '—';
    $('email').textContent = a.email || '—';
    $('exp').textContent = a.exp ? fmt(a.exp) : '—';
    $('state').innerHTML = a.busy ? state('busy') : a.ok === true ? state('ok') : state('');
    $('reqs').textContent = a.requests ?? '—';
    $('last').textContent = a.last_used ? fmt(a.last_used) : '—';
    $('agent').textContent = a.agent ? String(a.agent).slice(0, 8) + '…' : '—';
    $('health').innerHTML = a.hasAvailable === false
      ? '<span class="dot bad"></span>额度耗尽'
      : '<span class="dot ok"></span>可用';
    $('lat').textContent = (d.upstreamMs ?? '—') + ' ms';
    $('stamp').textContent = '更新于 ' + fmt(d.ts);
  } catch (e) {
    $('health').innerHTML = '<span class="dot bad"></span>不可达';
    $('stamp').textContent = '刷新失败：' + e.message;
  }
}

function add(role, text) {
  const p = document.createElement('p');
  p.className = 'msg';
  p.innerHTML = '<b>' + (role === 'user' ? 'YOU' : 'BOT') + '</b>';
  p.appendChild(document.createTextNode(text));
  $('log').appendChild(p);
  $('log').scrollTop = $('log').scrollHeight;
  return p;
}

$('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const q = $('q').value.trim();
  if (!q) return;
  $('q').value = '';
  $('send').disabled = true;
  add('user', q);
  const out = add('bot', '');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ model: $('model').value, messages: [{ role: 'user', content: q }] }),
    });
    if (!r.ok || !r.body) throw new Error('HTTP ' + r.status);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '', text = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data:')) continue; // 跳过 : keepalive / : connecting
        const payload = line.slice(5).trim();
        if (!payload || payload === '[DONE]') continue;
        try {
          const j = JSON.parse(payload);
          const d = j.choices?.[0]?.delta?.content;
          if (d) { text += d; out.innerHTML = '<b>BOT</b>'; out.appendChild(document.createTextNode(text)); $('log').scrollTop = $('log').scrollHeight; }
        } catch {}
      }
    }
    if (!text) out.innerHTML = '<b>BOT</b>（空回复）';
  } catch (e) {
    out.innerHTML = '<b>BOT</b>请求失败：' + e.message;
  } finally {
    $('send').disabled = false;
    $('q').focus();
    load();
  }
});

$('reload').addEventListener('click', load);
load();
setInterval(load, 30000);
</script>
</body>
</html>
